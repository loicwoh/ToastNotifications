<svg xmlns="http://www.w3.org/2000/svg" width="860" height="276" viewBox="0 0 860 276" role="img" aria-labelledby="title desc">
  <title id="title">ToastBuilder Add Text connector schematic</title>
  <desc id="desc">Pattern 4815. Inputs: ToastBuilder in slot 11 at top left, text slot 10 below, error in slot 8 at bottom left. Outputs: ToastBuilder out slot 3 at top right, error out slot 0 at bottom right. Other slots unused.</desc>
  <rect width="860" height="276" rx="10" fill="#f5f8fb"/>
  <g font-family="Segoe UI, sans-serif" font-size="18" fill="#132c41">
    <text x="430" y="30" text-anchor="middle" font-weight="600">Add Text · connector schematic</text>
    <text x="430" y="255" text-anchor="middle" font-size="15">4815 · slot numbers shown · grey = unassigned</text>
    <text x="260" y="81" text-anchor="end">ToastBuilder in</text>
    <text x="260" y="119" text-anchor="end">text</text>
    <text x="260" y="195" text-anchor="end">error in</text>
    <text x="600" y="81">ToastBuilder out</text>
    <text x="600" y="195">error out</text>
  </g>
  <g stroke="#132c41" stroke-width="2">
    <path d="M270 75H330 M270 113H330 M530 75H590" fill="none"/>
    <path d="M270 189H330 M530 189H590" stroke="#8b6412" fill="none"/>
  </g>
  <g stroke="#677c8b" fill="#e4eaf0" stroke-width="1.4">
    <path d="M330 56h50v38h-50z" fill="#d5e9f6"/>
    <path d="M330 94h50v38h-50z" fill="#f5dce9"/>
    <path d="M330 132h50v38h-50z"/>
    <path d="M330 170h50v38h-50z" fill="#fff1c9"/>
    <path d="M380 56h50v76h-50z M380 132h50v76h-50z M430 56h50v76h-50z M430 132h50v76h-50z"/>
    <path d="M480 56h50v38h-50z" fill="#d5e9f6"/>
    <path d="M480 94h50v38h-50z M480 132h50v38h-50z"/>
    <path d="M480 170h50v38h-50z" fill="#fff1c9"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="16" text-anchor="middle" fill="#132c41">
    <text x="355" y="81">11</text><text x="355" y="119">10</text><text x="355" y="157">9</text><text x="355" y="195">8</text>
    <text x="405" y="100">7</text><text x="405" y="176">6</text><text x="455" y="100">5</text><text x="455" y="176">4</text>
    <text x="505" y="81">3</text><text x="505" y="119">2</text><text x="505" y="157">1</text><text x="505" y="195">0</text>
  </g>
</svg>
