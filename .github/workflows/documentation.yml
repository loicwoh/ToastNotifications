name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A deployment contains the complete version catalogue. Serialize deployments so
# an older build cannot overwrite a more recent publication.
concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate VI reference and check local documentation links
        run: python Sources/docs/tools/docs_preview.py build --require-help-links
      - name: Check owner inventory URL, scope and route regressions
        run: python Sources/docs/tools/test_api_inventory.py
      - name: Check detailed help assembly, freshness and preservation
        run: python Sources/docs/tools/test_detailed_help.py

  build:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch documentation versions
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Build available branch and release documentation
        run: python Sources/docs/tools/build_versions.py --output _review/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _review/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v4
